apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudforge-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudforge-demo

  template:
    metadata:
      labels:
        app: cloudforge-demo

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: cloudforge-demo
          image: ghcr.io/aryans1319/cloudforge-demo-app
          
          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080  
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:  
              path: /health
              port: 8080    
            initialDelaySeconds: 40
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: cloudforge-config   
            - secretRef:
                name: cloudforge-secret       