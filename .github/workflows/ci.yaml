name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test application
        run: ./mvnw clean verify

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/cloudforge-demo-app
          TAG=${{ github.sha }}

          docker build -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG

      - name: Update Kubernetes image tag
        if: github.event_name == 'push'
        run: |
          sed -i "s/newTag: \".*\"/newTag: \"${{ github.sha }}\"/" k8s/overlays/dev/kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "gitops: deploy ${{ github.sha }} to dev"
          git push